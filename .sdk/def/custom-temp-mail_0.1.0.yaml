  /v1/inboxes/generate:
    post:
      summary: Bulk-generate inboxes (Inbox Generator)
      operationId: generateInboxes
      tags:
        - Public v1 - Inboxes
      description: |
        Bulk-creates random disposable inboxes and registers them to your account in one call.
        Each inbox comes with a long-lived per-inbox OTP token URL that lets you poll for
        verification codes without exposing your API key.

        **Requires:** Developer plan or above.

        **Authentication:** Use your **Gen API key** (`fcegen_…`) — a scoped key that can only
        call `/v1/inboxes/generate` and `/v1/otp/public`. Obtain it from the API Dashboard
        → Inbox Generator tab, or via the internal key management endpoints.

        **Billing:** 1 request per inbox generated (billed as N requests for a batch of N).

        **OTP fast-save mode:** API-generated inboxes skip OTP extraction at SMTP delivery time
        for maximum speed. The extraction happens on demand when you poll the OTP URL with
        `?parseCode=true` (appended by default). This shaves 5–20 ms off the SMTP hot path
        for high-volume workflows.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  description: Number of inboxes to generate (1–500 depending on plan).
                  default: 1
                  minimum: 1
                username_style:
                  type: string
                  description: >
                    Username generation style. One of:
                    `random_chars` (default), `digits_only`, `letters_only`,
                    `name`, `noun_digits`, `firstname.surname`.
                  default: random_chars
                domain_mode:
                  type: string
                  description: >
                    Which domain pool to use. One of:
                    `any` (default), `free_only`, `pro_only`, `custom_only`, `specific`.
                  default: any
                domains:
                  type: array
                  items:
                    type: string
                  description: Required when `domain_mode` is `specific`. List of domains to use.
                output_format:
                  type: string
                  description: >
                    Template string for each line of output. Variables:
                    `{email}`, `{username}`, `{domain}`, `{otp_url}`, `{token}`, `{api_key}`.
                  default: '{email}----{otp_url}'
                since:
                  type: integer
                  description: >
                    Unix timestamp in milliseconds. When provided, it is embedded as `?since=`
                    in every OTP URL so stale codes from previous sessions are ignored.
                parseCode:
                  type: boolean
                  description: >
                    When `true` (default), embeds `?parseCode=true` in every OTP URL.
                    This enables on-demand OTP extraction at poll time rather than at SMTP
                    delivery — required for API inboxes since they use the fast-save path.
                  default: true
                custom_firstnames:
                  type: array
                  items:
                    type: string
                  description: Custom first-name pool for `firstname.surname` style.
                custom_surnames:
                  type: array
                  items:
                    type: string
                  description: Custom surname pool for `firstname.surname` style.
      responses:
        '200':
          description: Inboxes generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 5
                  daily_used:
                    type: integer
                    nullable: true
                  daily_limit:
                    type: integer
                    nullable: true
                  daily_remaining:
                    type: integer
                    nullable: true
                  inboxes:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          example: jade.quasar21@addmy.space
                        username:
                          type: string
                          example: jade.quasar21
                        domain:
                          type: string
                          example: addmy.space
                        token:
                          type: string
                          example: fceotp_24f1add500d18150a02c62e4…
                        otp_url:
                          type: string
                          example: >-
                            https://api2.freecustom.email/v1/otp/public?token=fceotp_…&since=1716900000000&parseCode=true
                        formatted:
                          type: string
                          example: jade.quasar21@addmy.space----https://api2.freecustom.email/v1/otp/public?token=fceotp_…
        '400':
          description: Invalid parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Plan too low or daily/batch limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403Plan'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/otp/public:
    get:
      summary: Poll OTP via public token (no API key needed)
      operationId: getOtpPublic
      tags:
        - Public v1 - OTP
      description: |
        Returns the latest OTP for an inbox using a long-lived per-inbox token generated by
        `POST /v1/inboxes/generate`. No API key is required — safe to embed in scripts,
        Playwright tests, or CI pipelines without exposing your `fce_` key.

        Each token is valid for **365 days** from the time the inbox was generated.

        **parseCode=true (recommended for API inboxes):** API-generated inboxes skip OTP
        extraction at SMTP delivery time for speed. Pass `?parseCode=true` to trigger
        on-demand extraction from the stored email text. The OTP URLs produced by the
        Inbox Generator include this flag by default.

        **since:** Pass the Unix ms timestamp from just before you triggered the verification
        email to avoid getting a stale OTP from a previous session.
      parameters:
        - name: token
          in: query
          required: true
          description: Per-inbox OTP token (format `fceotp_…`). Generated by `POST /v1/inboxes/generate`.
          schema:
            type: string
            example: fceotp_24f1add500d18150a02c62e40b395828226a79ab
        - name: since
          in: query
          required: false
          description: >
            Unix timestamp in milliseconds. Only OTPs from messages received **after** this
            timestamp are returned. Use the timestamp captured just before triggering the
            verification email to skip stale codes.
          schema:
            type: integer
            example: 1716900000000
        - name: parseCode
          in: query
          required: false
          description: >
            When `true`, triggers on-demand OTP extraction from stored email text.
            Required for API-generated inboxes (fast-save path stores `otp: null`).
            The Inbox Generator embeds this flag in OTP URLs by default.
          schema:
            type: boolean
            default: false
      security: []
      responses:
        '200':
          description: OTP found or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResponse'
        '404':
          description: Token not found or expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: token_not_found
                  message:
                    type: string
                    example: Token not found or expired.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/inboxes/{inbox}/otp:
    get:
      summary: Get latest OTP
      operationId: getOtp
      tags:
        - Public v1 - OTP
      description: |
        Returns the OTP and/or verification link from the most recent message
        that contains one. Requires Growth plan or higher.

        **Cost**: 3 requests.

        On lower plans, message list endpoints return `otp: "__DETECTED__"` as a
        hint that an OTP exists — use this endpoint (Growth+) to read the actual value.

        **parseCode=true:** For API-generated inboxes (which use the fast-save path and
        store `otp: null`), pass `?parseCode=true` to trigger on-demand extraction from
        the stored email text. The Inbox Generator OTP URLs include this flag by default.
      parameters:
        - name: inbox
          in: path
          required: true
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: >
            Unix timestamp in milliseconds. Only OTPs from messages received after this
            timestamp are returned.
          schema:
            type: integer
        - name: parseCode
          in: query
          required: false
          description: >
            When `true`, includes messages where `otp` is null and triggers on-demand
            extraction from stored text. Use for API-generated inboxes.
          schema:
            type: boolean
            default: false
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success (OTP found or null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Plan too low — requires Growth plan ($89/mo) or above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403Plan'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/inboxes/{inbox}/wait:
    get:
      summary: Wait for next message (Long Polling)
      operationId: waitMessage
      tags:
        - Public v1 - Messages
      description: >
        Wait for a new email to arrive in the specified mailbox (Long Polling).

        This eliminates the need for rapid polling and reduces request overhead.


        **Plan Requirement**: Developer or above.

        **Billing**: High-value endpoint; 1 wait call consumes **10 monthly
        requests**.
      parameters:
        - name: inbox
          in: path
          required: true
          schema:
            type: string
        - name: timeout
          in: query
          description: Max seconds to wait (10-60 recommended, default 30).
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 60
        - name: since
          in: query
          description: >-
            Last seen message ID. Return immediately if a newer message exists,
            otherwise wait.
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: New message received
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: New message received
                  data:
                    $ref: '#/components/schemas/MessageSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Plan too low — requires Developer plan or above
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403Plan'
        '408':
          description: Timeout reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Timeout reached
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/webhooks:
